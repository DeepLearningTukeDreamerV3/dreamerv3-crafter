# Docker Compose wrapper around the upstream Dockerfile.
# Usage: see DOCKER.md. Copy .env.example to .env to change defaults.

x-dreamer: &dreamer
  build:
    context: .
    dockerfile: Dockerfile
  image: dreamerv3:${TAG:-latest}
  volumes:
    - ${LOGDIR:-./logdir}:/logdir
    # Whole repo mounted: live code edits without rebuilding the image.
    - .:/app
  shm_size: 8gb

services:
  # GPU training. Needs nvidia-container-toolkit on the host.
  train:
    <<: *dreamer
    profiles: [gpu]
    environment:
      XLA_PYTHON_CLIENT_MEM_FRACTION: "${XLA_MEM_FRACTION:-0.8}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      python upstream/dreamerv3/main.py
      --logdir /logdir/{timestamp}
      --configs ${CONFIGS:-crafter}
      --run.train_ratio ${TRAIN_RATIO:-32}

  # CPU training. No GPU toolkit needed; slow, meant for debugging.
  train-cpu:
    <<: *dreamer
    profiles: [cpu]
    environment:
      JAX_PLATFORMS: cpu
    command: >
      python upstream/dreamerv3/main.py
      --logdir /logdir/{timestamp}
      --configs ${CONFIGS_CPU:-crafter debug}
      --jax.platform cpu

  # Scope web viewer for logged metrics and videos.
  viewer:
    <<: *dreamer
    entrypoint: []  # Skip the xvfb wrapper from entrypoint.sh.
    ports:
      - "${VIEWER_PORT:-8000}:8000"
    command: scope --basedir /logdir --port 8000 --workers 2
